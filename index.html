<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>DocChase — Stop Chasing Clients for Documents</title>
    <meta name="description" content="DocChase automates recurring client document collection for accounting and bookkeeping firms. Stop chasing clients — let smart reminders do it." />
    <meta name="theme-color" content="#4f46e5" />

    <!-- Open Graph / Social Sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="DocChase — Stop Chasing Clients for Documents" />
    <meta property="og:description" content="AI-powered recurring document collection for accounting firms. Automated reminders, secure uploads, Gemini AI checklists." />
    <meta property="og:site_name" content="DocChase" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="DocChase — Document Collection for Accountants" />
    <meta name="twitter:description" content="Stop chasing clients for documents. DocChase automates the entire recurring document collection workflow." />

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    
    <!-- Google Material Symbols Outlined -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />

    <!-- Anti-FOUC Theme Script -->
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('docchase_theme') || 'system';
          var isDark = stored === 'dark' || (stored === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-surface font-sans text-on-surface antialiased min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
